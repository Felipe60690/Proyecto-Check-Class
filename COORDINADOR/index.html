<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinador</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: Georgia, "Times New Roman", serif;
        }

        .pagina {
            width: 100%;
            min-height: 100vh;
            position: relative;
            padding: 35px 7%;
        }

        /* =========================
           FLECHA VOLVER
        ========================= */

        .volver {
            background: none;
            border: none;
            font-size: 65px;
            font-weight: bold;
            cursor: pointer;
            color: #111;
            margin-bottom: 10px;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        .encabezado {
            height: 120px;
            background: #112b44;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 65px;

            border-radius: 0 0 50% 15%;

            overflow: hidden;
        }

        .encabezado::after {
            content: "";
            position: absolute;

            width: 110%;
            height: 45px;

            background: #f5b642;

            bottom: -25px;
            left: -5%;

            border-radius: 50%;
        }

        .encabezado h1 {
            color: white;

            font-family: Arial, sans-serif;
            font-size: 52px;
            font-weight: bold;

            letter-spacing: 1px;

            position: relative;
            z-index: 2;
        }


        /* =========================
           LOGO MEJORADO
        ========================= */

        .logo {
            position: absolute;

            right: 16%;
            top: 18px;

            width: 75px;
            height: 75px;

            z-index: 5;
        }

        .logo-circulo {
            position: absolute;

            width: 60px;
            height: 60px;

            border: 6px solid #e2a63d;
            border-radius: 50%;

            right: 5px;
            top: 5px;
        }

        .logo-check {
            position: absolute;

            color: #e2a63d;

            font-family: Arial, sans-serif;

            font-size: 52px;
            font-weight: bold;

            right: 8px;
            top: 4px;

            transform: rotate(-8deg);
        }

        .logo-estrella {
            position: absolute;

            color: #ffd36a;

            font-size: 22px;

            right: -2px;
            top: -5px;
        }


        /* =========================
           TARJETA PRINCIPAL
        ========================= */

        .tarjeta {
            width: 650px;
            height: 430px;

            margin: auto;

            position: relative;

            background: linear-gradient(
                145deg,
                #17334e,
                #0b2035
            );

            border-radius: 25px;

            padding: 30px 70px;

            box-shadow: 0 3px 8px rgba(0,0,0,.25);
        }


        /* =========================
           PARTE SUPERIOR
        ========================= */

        .parte-superior {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 50px;

            margin-bottom: 10px;
        }


        /* =========================
           FLECHAS
        ========================= */

        .flechas {
            display: flex;
            flex-direction: column;
        }

        .flechas button {
            width: 70px;
            height: 50px;

            background: transparent;
            border: none;

            color: #ffb847;

            font-size: 65px;

            cursor: pointer;

            line-height: 35px;
        }

        .flechas button:hover {
            transform: scale(1.1);
        }


        /* =========================
           GRADOS
        ========================= */

        .grados {
            width: 110px;

            overflow: hidden;

            border-radius: 20px;
        }

        .grados button {
            display: block;

            width: 100%;
            height: 53px;

            border: none;

            background: linear-gradient(
                #ffd064,
                #f1a842
            );

            color: #222;

            font-family: Georgia, serif;

            font-size: 25px;

            cursor: pointer;
        }

        .grados button:hover {
            filter: brightness(1.1);
        }

        .grados button.activo {
            background: linear-gradient(
                #ffe18a,
                #ffb642
            );

            font-weight: bold;

            box-shadow: inset 0 0 0 3px #fff2bf;
        }


        /* =========================
           CONTRASEÑA
        ========================= */

        .tarjeta label {
            display: block;

            color: #e3ae72;

            font-size: 25px;

            margin: 5px 0 8px;
        }

        .tarjeta input {
            width: 100%;
            height: 49px;

            border: none;
            outline: none;

            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #ffd45e,
                #efa65a
            );

            color: #222;

            text-align: center;

            font-family: Arial, sans-serif;

            font-size: 18px;
            font-weight: bold;
        }


        /* =========================
           BOTÓN CREAR
        ========================= */

        .crear {
            display: block;

            margin: 20px auto;

            width: 145px;
            height: 54px;

            border: none;

            border-radius: 30px;

            background: linear-gradient(
                #ffd45e,
                #f1aa43
            );

            color: #3b332b;

            font-family: Arial, sans-serif;

            font-size: 19px;

            cursor: pointer;
        }

        .crear:hover {
            transform: scale(1.05);
        }

        .crear:active {
            transform: scale(.95);
        }


        /* =========================
           GENERAL / MESES
        ========================= */

        .general {
            position: absolute;

            right: 25px;
            bottom: 35px;

            text-align: center;

            font-family: Arial, sans-serif;
        }

        .numero {
            width: 48px;
            height: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto;

            border-radius: 6px;

            background: #ffd36a;

            color: #333;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .general p {
            color: white;

            font-size: 17px;

            margin-top: 3px;

            cursor: pointer;
        }

        .mes {
            color: #ffd36a;

            font-size: 14px;

            margin-top: 5px;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================
           SELECTOR LATERAL
        ========================= */

        .selector {
            position: absolute;

            right: 4%;
            top: 51%;

            width: 70px;
            height: 195px;

            background: #142d47;

            text-align: center;

            clip-path: polygon(
                0 0,
                100% 0,
                100% 82%,
                50% 100%,
                0 82%
            );

            overflow: hidden;
        }

        .nivel {
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 24px;

            cursor: pointer;
        }

        .nivel:hover {
            background: #234764;
        }

        .nivel.activo {
            color: #ffd36a;
            background: #193953;
            font-weight: bold;
        }


        /* =========================
           BOTONES VERDE Y ROJO
        ========================= */

        .estados {
            position: absolute;

            right: 0.8%;
            top: 50%;

            display: flex;

            gap: 10px;
        }

        .estados button {
            background: transparent;
            border: none;

            font-family: Arial, sans-serif;

            font-size: 45px;

            cursor: pointer;
        }

        .correcto {
            color: #63b861;
        }

        .prohibido {
            color: #a72f37;
        }


        /* =========================
           MENÚ DE MESES
        ========================= */

        .menu-meses {
            position: absolute;

            right: 20px;
            bottom: 85px;

            width: 145px;

            background: #142d47;

            border-radius: 15px;

            padding: 8px;

            display: none;

            box-shadow: 0 4px 15px rgba(0,0,0,.4);

            z-index: 20;
        }

        .menu-meses.mostrar {
            display: block;
        }

        .mes-opcion {
            width: 100%;

            padding: 9px;

            border: none;

            border-radius: 8px;

            background: transparent;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .mes-opcion:hover {
            background: #234764;
        }

        .mes-opcion.activo {
            background: #f5b642;
            color: #222;
            font-weight: bold;
        }


        /* =========================
           MENSAJE
        ========================= */

        .mensaje {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            background: #112b44;

            color: white;

            padding: 12px 25px;

            border-radius: 25px;

            font-family: Arial, sans-serif;

            display: none;

            z-index: 100;
        }

        .mensaje.mostrar {
            display: block;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            .tarjeta {
                width: 90%;
            }

            .selector,
            .estados {
                display: none;
            }

            .encabezado h1 {
                font-size: 38px;
            }

            .logo {
                right: 8%;
            }
        }


        @media (max-width: 600px) {

            .pagina {
                padding: 20px;
            }

            .encabezado {
                height: 100px;
            }

            .encabezado h1 {
                font-size: 28px;
            }

            .tarjeta {
                width: 100%;
                padding: 25px;
            }

            .parte-superior {
                gap: 20px;
            }

            .menu-meses {
                right: 10px;
            }
        }

    </style>
</head>


<body>

    <div class="pagina">

        <!-- =========================
             FLECHA VOLVER
        ========================= -->

        <button class="volver" onclick="volver()">
            ←
        </button>


        <!-- =========================
             ENCABEZADO
        ========================= -->

        <div class="encabezado">

            <h1>
                COORDINADOR
            </h1>

            <div class="logo">

                <div class="logo-circulo"></div>

                <div class="logo-check">
                    ✓
                </div>

                <div class="logo-estrella">
                    ✦
                </div>

            </div>

        </div>


        <!-- =========================
             TARJETA
        ========================= -->

        <div class="tarjeta">


            <!-- FLECHAS Y GRADOS -->

            <div class="parte-superior">

                <div class="flechas">

                    <!-- SUBIR GRADO -->
                    <button onclick="gradoAnterior()">
                        ⌃
                    </button>

                    <!-- BAJAR GRADO -->
                    <button onclick="gradoSiguiente()">
                        ⌄
                    </button>

                </div>


                <!-- GRADOS VISIBLES -->

                <div class="grados">

                    <button
                        id="gradoArriba"
                        onclick="seleccionarGrado(8)"
                    >
                        8°
                    </button>

                    <button
                        id="gradoActual"
                        onclick="seleccionarGrado(9)"
                        class="activo"
                    >
                        9°
                    </button>

                    <button
                        id="gradoAbajo"
                        onclick="seleccionarGrado(10)"
                    >
                        10°
                    </button>

                </div>

            </div>


            <!-- =========================
                 CONTRASEÑA
            ========================= -->

            <label for="password">
                Contraseña:
            </label>

            <input
                id="password"
                type="text"
                value="Javiera.Lfeb"
            >


            <!-- =========================
                 CREAR
            ========================= -->

            <button
                class="crear"
                onclick="crear()"
            >
                CREAR
            </button>


            <!-- =========================
                 GENERAL
            ========================= -->

            <div
                class="general"
                onclick="mostrarMeses()"
            >

                <div
                    class="numero"
                    id="numeroMes"
                >
                    1
                </div>

                <p>
                    GENERAL
                </p>

                <div
                    class="mes"
                    id="nombreMes"
                >
                    ENERO
                </div>

            </div>


            <!-- MENÚ DE MESES -->

            <div
                class="menu-meses"
                id="menuMeses"
            >

                <button class="mes-opcion" onclick="seleccionarMes(0)">
                    ENERO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(1)">
                    FEBRERO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(2)">
                    MARZO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(3)">
                    ABRIL
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(4)">
                    MAYO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(5)">
                    JUNIO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(6)">
                    JULIO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(7)">
                    AGOSTO
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(8)">
                    SEPTIEMBRE
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(9)">
                    OCTUBRE
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(10)">
                    NOVIEMBRE
                </button>

                <button class="mes-opcion" onclick="seleccionarMes(11)">
                    DICIEMBRE
                </button>

            </div>

        </div>


        <!-- =========================
             SELECTOR LATERAL
        ========================= -->

        <div class="selector">

            <div
                class="nivel"
                id="nivel8"
                onclick="seleccionarGrado(8)"
            >
                8°
            </div>

            <div
                class="nivel activo"
                id="nivel9"
                onclick="seleccionarGrado(9)"
            >
                9°
            </div>

            <div
                class="nivel"
                id="nivel10"
                onclick="seleccionarGrado(10)"
            >
                10°
            </div>

        </div>


        <!-- =========================
             BOTONES
        ========================= -->

        <div class="estados">

            <button
                class="correcto"
                onclick="aceptar()"
            >
                ✓
            </button>

            <button
                class="prohibido"
                onclick="cancelar()"
            >
                ⊘
            </button>

        </div>


        <!-- MENSAJE -->

        <div
            class="mensaje"
            id="mensaje"
        >
        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           DATOS
        ========================= */

        const grados = [6, 7, 8, 9, 10, 11];

        const meses = [
            "ENERO",
            "FEBRERO",
            "MARZO",
            "ABRIL",
            "MAYO",
            "JUNIO",
            "JULIO",
            "AGOSTO",
            "SEPTIEMBRE",
            "OCTUBRE",
            "NOVIEMBRE",
            "DICIEMBRE"
        ];

        let gradoSeleccionado = 9;

        let mesSeleccionado = 0;


        /* =========================
           CAMBIAR GRADO
        ========================= */

        function actualizarGrado() {

            const posicion =
                grados.indexOf(gradoSeleccionado);


            let arriba;

            let abajo;


            if (posicion === 0) {

                arriba = grados[0];

            } else {

                arriba = grados[posicion - 1];

            }


            if (posicion === grados.length - 1) {

                abajo = grados[grados.length - 1];

            } else {

                abajo = grados[posicion + 1];

            }


            document.getElementById(
                "gradoArriba"
            ).textContent = arriba + "°";


            document.getElementById(
                "gradoActual"
            ).textContent =
                gradoSeleccionado + "°";


            document.getElementById(
                "gradoAbajo"
            ).textContent = abajo + "°";


            document.getElementById(
                "gradoArriba"
            ).onclick =
                function () {
                    seleccionarGrado(arriba);
                };


            document.getElementById(
                "gradoActual"
            ).onclick =
                function () {
                    seleccionarGrado(gradoSeleccionado);
                };


            document.getElementById(
                "gradoAbajo"
            ).onclick =
                function () {
                    seleccionarGrado(abajo);
                };


            /* Selector lateral */

            const nivel8 =
                document.getElementById("nivel8");

            const nivel9 =
                document.getElementById("nivel9");

            const nivel10 =
                document.getElementById("nivel10");


            nivel8.textContent =
                gradoSeleccionado === 6 ||
                gradoSeleccionado === 7 ||
                gradoSeleccionado === 8
                    ? gradoSeleccionado + "°"
                    : arriba + "°";


            nivel9.textContent =
                gradoSeleccionado + "°";


            nivel10.textContent =
                abajo + "°";


            nivel8.classList.remove("activo");
            nivel9.classList.remove("activo");
            nivel10.classList.remove("activo");


            if (gradoSeleccionado === 6 ||
                gradoSeleccionado === 7 ||
                gradoSeleccionado === 8) {

                nivel8.classList.add("activo");

            } else {

                nivel9.classList.add("activo");

            }

        }


        function gradoAnterior() {

            const posicion =
                grados.indexOf(gradoSeleccionado);


            if (posicion > 0) {

                gradoSeleccionado =
                    grados[posicion - 1];

                actualizarGrado();

            }

        }


        function gradoSiguiente() {

            const posicion =
                grados.indexOf(gradoSeleccionado);


            if (posicion < grados.length - 1) {

                gradoSeleccionado =
                    grados[posicion + 1];

                actualizarGrado();

            }

        }


        function seleccionarGrado(grado) {

            gradoSeleccionado = grado;

            actualizarGrado();

            mostrarMensaje(
                "Grado seleccionado: " +
                grado + "°"
            );

        }


        /* =========================
           MESES
        ========================= */

        function actualizarMes() {

            document.getElementById(
                "numeroMes"
            ).textContent =
                mesSeleccionado + 1;


            document.getElementById(
                "nombreMes"
            ).textContent =
                meses[mesSeleccionado];


            const botones =
                document.querySelectorAll(
                    ".mes-opcion"
                );


            botones.forEach(
                function(boton, indice) {

                    boton.classList.remove(
                        "activo"
                    );

                    if (
                        indice ===
                        mesSeleccionado
                    ) {

                        boton.classList.add(
                            "activo"
                        );

                    }

                }
            );

        }


        function mostrarMeses() {

            const menu =
                document.getElementById(
                    "menuMeses"
                );

            menu.classList.toggle(
                "mostrar"
            );

        }


        function seleccionarMes(indice) {

            mesSeleccionado = indice;

            actualizarMes();

            document.getElementById(
                "menuMeses"
            ).classList.remove(
                "mostrar"
            );

            mostrarMensaje(
                "Mes seleccionado: " +
                meses[indice]
            );

        }


        /* =========================
           CREAR
        ========================= */

        function crear() {

            const password =
                document.getElementById(
                    "password"
                ).value;


            mostrarMensaje(
                "Creado: " +
                gradoSeleccionado +
                "° - " +
                meses[mesSeleccionado]
            );

        }


        /* =========================
           BOTÓN VERDE
        ========================= */

        function aceptar() {

            mostrarMensaje(
                "✓ Selección aceptada"
            );

        }


        /* =========================
           BOTÓN ROJO
        ========================= */

        function cancelar() {

            mostrarMensaje(
                "⊘ Selección cancelada"
            );

        }


        /* =========================
           VOLVER
        ========================= */

        function volver() {

            mostrarMensaje(
                "Volviendo..."
            );

        }


        /* =========================
           MENSAJES
        ========================= */

        function mostrarMensaje(texto) {

            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            mensaje.textContent = texto;

            mensaje.classList.add(
                "mostrar"
            );


            setTimeout(
                function() {

                    mensaje.classList.remove(
                        "mostrar"
                    );

                },
                2000
            );

        }


        /* =========================
           INICIO
        ========================= */

        actualizarGrado();

        actualizarMes();


    </script>

</body>
</html>
